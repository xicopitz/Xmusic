[package]
name = "xmusic"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
argon2 = "0.6.0"
chrono = "0.4.45"
cron = "0.17.0"
getrandom = "0.4.3"
hex = "0.4.3"
lofty = "0.25.5"
notify = "8.2.1"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strsim = "0.11.1"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"

[profile.release]
strip = true
